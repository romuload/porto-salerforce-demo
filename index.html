<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSA - Porto Seguro | Protótipo</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css?v=16">
</head>
<body>
  <div class="brand-band" aria-hidden="true"></div>

  <!-- Global header -->
  <header class="global-header">
    <a class="cloud" href="#/dashboard" aria-label="Início"><img src="assets/cloud.svg" alt=""></a>
    <div class="global-search" role="search">
      <button class="scope" type="button">All <img src="assets/down.svg" alt=""></button>
      <label class="search-input">
        <img src="assets/search.svg" alt="">
        <input type="search" placeholder="Search Salesforce" aria-label="Search Salesforce">
      </label>
    </div>
    <div class="global-actions">
      <button type="button" class="ga" aria-label="Favoritos"><img src="assets/favorites.svg" alt="" width="40" height="22"></button>
      <button type="button" class="ga" aria-label="Criar"><img src="assets/create.svg" alt="" width="20" height="20"></button>
      <button type="button" class="ga" aria-label="Ajuda"><img src="assets/help.svg" alt="" width="14" height="20"></button>
      <button type="button" class="ga" aria-label="Configuração"><img src="assets/setup.svg" alt="" width="18" height="20"></button>
      <button type="button" class="ga" aria-label="Notificações"><img src="assets/bell.svg" alt="" width="20" height="20"></button>
      <button type="button" class="ga avatar" aria-label="Perfil"><img src="assets/avatar.svg" alt="" width="32" height="32"></button>
    </div>
  </header>

  <!-- Console navigation -->
  <nav class="console-nav" aria-label="Navegação do app">
    <div class="app-name">
      <button type="button" class="waffle" aria-label="App Launcher"><img src="assets/waffle.svg" alt=""></button>
      <a href="#/dashboard">GSA - Porto Seguro</a>
    </div>
    <div class="nav-item is-active">
      <a href="#/dashboard">Cases</a>
      <button type="button" class="nav-drop" aria-label="Mais opções de Cases"><img src="assets/chevron.svg" alt=""></button>
    </div>
    <div class="workspace-tab">
      <img src="assets/case.svg" alt="" class="ws-icon">
      <a href="#/caso/2024.04.1.99.000111222" id="ws-tab-link">000002 | Case</a>
      <img src="assets/chevron-sm.svg" alt="" class="ws-small">
      <button type="button" class="ws-close" aria-label="Fechar aba"><img src="assets/close.svg" alt=""></button>
    </div>
  </nav>

  <div class="split-toggle" aria-hidden="true"><img src="assets/right.svg" alt=""></div>

  <main id="app" tabindex="-1"></main>

  <!-- Docked utility bar -->
  <footer class="utility-bar">
    <button type="button"><img src="assets/omni.svg" alt="">Omni-Channel (Online)</button>
    <button type="button"><img src="assets/macros.svg" alt="">Macros</button>
    <button type="button"><img src="assets/clock.svg" alt="">History</button>
    <button type="button"><img src="assets/note.svg" alt="">Notes</button>
  </footer>

  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>

  <script src="data.js?v=16"></script>
  <script src="app.js?v=16"></script>
</body>
</html>
